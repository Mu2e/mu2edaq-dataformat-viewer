notes:
  yaml_vs_overlay: >
    Compared field by field (name, word, bits/width) against
    artdaq-core-mu2e cf86c07 headers plus the pack/unpack functions they name,
    and against the shipped spec doc/mu2e-dataformat.pdf (Mu2e-doc-4914 V53).
    Data Header: all 8 words agree among YAML, spec and RocDataHeaderPacket_t;
    subsystem-ID values differ (YAML/spec 7=TDAQ, 3/6 reserved; overlay
    3=Other, 6=MobileSync, 7=Unused). Heartbeat: YAML disagrees with spec and
    overlay (which agree): on-spill flag YAML word 5 bit 0 vs word 7 bit 0
    (mode4&1, byte 14); TEM/STM in word 6 vs word 7; YAML invents "Event Mode
    Byte 5" at word 7 [15:8] where spec/overlay have the Delivery Ring TDC
    (byte 15); YAML moves TDC to word 8 and CRC to word 9. Data Request:
    Debug Type YAML word 6 [15:12] vs spec/overlay [7:4] (byte 12 = type<<4 |
    debug); debug packet count 11 vs 16 bits; overlay adds debug types 3/4.
    Debug Header (spec only, no overlay class): YAML Op Code at word 1 [7:3]
    overlaps ROC Link ID and displaces Debug Type. Verdict S2 (DFV-001).
  artdaq_core_mu2e_relation: >
    No code dependency, so not in depends_on. The two packages encode the same
    wire contract by hand with no shared source or test. Evidence pairs:
    formats/heartbeat_packet.yaml:138 vs
    artdaq-core-mu2e/Overlays/DTC_Types/DTC_EventMode.h:26.
  cross_package_observation: >
    artdaq-core-mu2e DTC_DMAPacket::ConvertToDataPacket writes subsystemID to
    word 1 bits 14:12 (DTC_DMAPacket.cpp:21) but the DTC_DataPacket
    constructor reads it from word 2 bits 15:13 (:43), which is where the spec
    and RocDataHeaderPacket_t put it. Not filed here; for the artdaq-core-mu2e
    reviewer.
  bounds_checks: >
    get_word returns None past the end and parse_fields skips the field
    (mu2edaq-dataformat-viewer.py:82-88, :115-116); no out-of-range read is
    possible. Gaps: unbounded TCP read to EOF with a thread per connection,
    0.0.0.0 bind with no peer filter, and no marker for skipped fields
    (DFV-004).
  discovery_meta: >
    Responder constructed without meta (mu2edaq-dataformat-viewer.py:1090-1091);
    CONTRACT 9.5 string-only rule holds. It announces before the listener
    exists (DFV-006).
  test_dir: >
    test/ is not empty: it holds test.dat (20-byte big-endian heartbeat) and
    test2.dat (2048 bytes). There is no test code (DFV-007).
  cpp_build: >
    cmake -S cpp -B <scratch> && cmake --build: clean, no warnings, on macOS
    2026-10-06; produces static libmu2e_sender.a and mu2e_send.
  readme: >
    Existing README.md is project-specific, not boilerplate; left unchanged
    (its errors are DFV-010). No INSTALL.md: README already gives the CMake
    and pip steps. No OPERATIONS.md: GUI, no daemon.
  loc: >
    2628 = Python 2046 (viewer 1101, sender 786, config 158+1) + C/C++ 393 +
    CMake 47 + shell 142. Excludes 3265 lines of formats/*.yaml, Markdown and
    the PDF.
  man_layout: >
    New pages in man/manN/; no git mv; no stale path references.
