schema: mega-review/1
package: mu2edaq-dataformat-viewer
tier: A
group: operations
repo:
  url: git@github.com:Mu2e/mu2edaq-dataformat-viewer.git
  exists: true
  issues_enabled: true
doc_dir: doc
summary: >
  PyQt6 viewer and sender that decode and construct Mu2e ROC packets field by
  field from hand-written YAML layouts of Mu2e-doc-4914, with a TCP/UDP
  listener on 7755 and a small C sender library and CLI
languages: [python, cpp, bash]
loc: 2628

runtime:
  executables:
    - name: mu2edaq-dataformat-viewer.py
      kind: gui
      man_page: man/man1/mu2edaq-dataformat-viewer.py.1
    - name: mu2edaq-dataformat-sender.py
      kind: gui
      man_page: man/man1/mu2edaq-dataformat-sender.py.1
    - name: start-mu2edaq-dataformat-viewer.sh
      kind: script
      man_page: man/man1/start-mu2edaq-dataformat-viewer.sh.1
    - name: stop-mu2edaq-dataformat-viewer.sh
      kind: script
      man_page: man/man1/stop-mu2edaq-dataformat-viewer.sh.1
    - name: bootstrap.sh
      kind: script
      man_page: man/man1/bootstrap.sh.1
    - name: mu2e_send
      kind: cli
      man_page: man/man1/mu2e_send.1
    - name: libmu2e_sender
      kind: library
      man_page: man/man3/libmu2e_sender.3
  services: []
  ports:
    - {port: 7755, proto: tcp, role: packet-listener-operator-started, source: "config/mu2e-viewer.yaml:15"}
    - {port: 7755, proto: udp, role: packet-listener-operator-started, source: "mu2edaq-dataformat-viewer.py:986"}
    - {port: 28999, proto: udp, role: discovery-responder, source: "mu2edaq-dataformat-viewer.py:1090"}
  config_files: [config/mu2e-viewer.yaml, "formats/*.yaml"]
  env_vars: [CRS_PORT_LISTEN, CRS_STOP_TIMEOUT, DISPLAY, PYTHON]

interactions:
  depends_on:
    - package: mu2edaq-discovery
      via: import
      direction: out
      evidence: "mu2edaq-dataformat-viewer.py:1089"
  depended_on_by: []
  external: [pypi, github.com]

quality:
  tests: {present: false, framework: none, count: 0}
  ci: {present: false, workflows: []}
  license: MIT
  artifacts_clean: true

